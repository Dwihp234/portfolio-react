name: Deploy to Hostinger via SFTP

on:
  push:
    branches:
      - master  # Ganti jika branch utama kamu 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload to Hostinger via SFTP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          port: 22 # atau 21 jika pakai FTP, sesuaikan dengan Hostinger
          source: "./*"                # Semua file di repo, bisa diubah
          target: "public_html"        # Folder tujuan di Hostinger
